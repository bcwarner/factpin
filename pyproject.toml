[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "factpin"
version = "0.2.0"
description = "Pin constants computed in analysis code into a LaTeX manuscript"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin C. Warner" }]
keywords = ["latex", "siunitx", "reproducibility", "manuscript", "constants"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
factpin = "factpin.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factpin"]

[tool.hatch.build.targets.wheel.force-include]
"src/factpin/tex/factpin.sty" = "factpin/tex/factpin.sty"

[tool.hatch.build.targets.sdist]
include = ["src/factpin", "tests", "examples", "README.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
